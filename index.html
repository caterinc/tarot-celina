<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot com a Celina</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(150deg, #f3e8ff 0%, #e9d5ff 50%, #ddd6fe 100%);
  background-attachment: fixed;
  color: #1e1b4b;
  font-size: 15px;
  padding: 32px 16px 64px;
}

.page { display: none; max-width: 420px; margin: 0 auto; }
.page.active { display: block; }

/* Header */
.header { text-align: center; margin-bottom: 28px; }
.header h1 { font-size: 22px; font-weight: 700; color: #3b0764; }
.header h1 span { color: #7c3aed; }
.header p {
  font-size: 11px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase;
  color: #8b5cf6; margin-top: 5px;
}

/* Section title */
.sec {
  font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: #7c3aed;
  display: flex; align-items: center; gap: 10px;
  margin: 24px 0 12px;
}
.sec::before, .sec::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(124,58,237,.2);
}

/* Grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Plan card */
.plan {
  background: #fff;
  border: 1.5px solid rgba(124,58,237,.15);
  border-radius: 14px;
  padding: 16px 14px 14px;
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: transform .12s;
}
.plan:active { transform: scale(.97); }
.plan.featured { border-color: rgba(22,163,74,.4); background: #f0fdf4; }
.plan.spiritual { border-color: rgba(124,58,237,.25); background: #faf5ff; }
.plan.loading { opacity: .5; pointer-events: none; }

.badge {
  position: absolute; top: -10px; left: 12px;
  background: #16a34a; color: #fff;
  font-size: 9px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
}

.plan-name { font-size: 12px; font-weight: 600; color: #3b0764; line-height: 1.3; margin-bottom: 3px; }
.plan-desc { font-size: 11px; color: #8b5cf6; margin-bottom: 10px; }
.plan-price { font-size: 20px; font-weight: 700; color: #5b21b6; font-variant-numeric: tabular-nums; }
.plan.featured .plan-price { color: #15803d; }

.plan-btn {
  display: block; width: 100%; margin-top: 10px;
  background: #7c3aed; color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 11px; font-weight: 600;
  border: none; border-radius: 8px;
  padding: 8px; cursor: pointer;
  pointer-events: none;
}
.plan.featured .plan-btn { background: #16a34a; }
.plan.spiritual .plan-btn { background: #6d28d9; }

/* PIX page */
.pix-wrap {
  background: #fff;
  border-radius: 20px;
  padding: 28px 20px 32px;
  text-align: center;
  box-shadow: 0 4px 30px rgba(91,33,182,.12);
}

.back-btn {
  display: inline-block; margin-bottom: 22px;
  font-size: 12px; font-weight: 500; color: #8b5cf6;
  cursor: pointer; background: none; border: none;
  font-family: 'Poppins', sans-serif;
}

.pix-plan { font-size: 13px; font-weight: 600; color: #7c3aed; margin-bottom: 4px; }
.pix-price { font-size: 32px; font-weight: 700; color: #3b0764; margin-bottom: 20px; }

#qr-wrap {
  display: flex; justify-content: center;
  margin-bottom: 16px; min-height: 60px; align-items: center;
}
#qr-wrap canvas, #qr-wrap img {
  border-radius: 10px; border: 5px solid #ede9fe;
}

.spinner {
  width: 24px; height: 24px;
  border: 3px solid rgba(124,58,237,.2);
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.pix-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: .15em; text-transform: uppercase;
  color: #9ca3af; margin-bottom: 8px;
}

.pix-code {
  font-family: monospace; font-size: 9px;
  color: #9ca3af; background: #f9fafb;
  border-radius: 8px; padding: 8px 10px;
  word-break: break-all; line-height: 1.5;
  max-height: 56px; overflow: hidden;
  text-align: left; margin-bottom: 14px;
}

.btn-copy {
  width: 100%;
  background: #7c3aed; color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 15px; font-weight: 600;
  border: none; border-radius: 12px;
  padding: 15px; cursor: pointer;
  transition: background .15s;
  margin-bottom: 14px;
}
.btn-copy.ok { background: #16a34a; }

.pix-note { font-size: 12px; color: #9ca3af; line-height: 1.6; }

.err {
  font-size: 12px; color: #dc2626;
  background: #fef2f2; border-radius: 8px;
  padding: 10px 12px; margin-bottom: 14px;
  display: none; text-align: left;
}
</style>
</head>
<body>

<!-- Planos -->
<div class="page active" id="page-plans">
  <div class="header">
    <h1>Tarot com a <span>Celina</span></h1>
    <p>Orientação · Intuição · Transformação</p>
  </div>
  <div class="sec">Consultas de Tarot</div>
  <div class="grid" id="grid-c"></div>
  <div class="sec" style="margin-top:28px">Trabalhos Espirituais</div>
  <div class="grid" id="grid-e"></div>
</div>

<!-- PIX -->
<div class="page" id="page-pix">
  <div style="max-width:420px;margin:0 auto">
    <button class="back-btn" id="btn-back">← Voltar</button>
    <div class="pix-wrap">
      <div class="pix-plan" id="pix-name"></div>
      <div class="pix-price" id="pix-price"></div>
      <div id="qr-wrap"></div>
      <div class="pix-label">PIX Copia e Cola</div>
      <div class="pix-code" id="pix-code"></div>
      <div class="err" id="err"></div>
      <button class="btn-copy" id="btn-copy">Copiar código PIX</button>
      <div class="pix-note">Após pagar, envie o comprovante<br>pelo WhatsApp para a Celina.</div>
    </div>
  </div>
</div>

<script>
const CONSULTAS = [
  { name:'Tiragem Básica',           desc:'3 perguntas',                 price:900,   label:'R$ 9'   },
  { name:'Tiragem Intermediária',    desc:'6 perguntas',                 price:1500,  label:'R$ 15'  },
  { name:'Tiragem Completa',         desc:'Amor, trabalho e espiritual', price:3000,  label:'R$ 30', featured:true },
  { name:'Cartas Canalizadas',       desc:'Mensagens espirituais',       price:6000,  label:'R$ 60'  },
];
const ESPIRITUAIS = [
  { name:'Atração Irresistível', desc:'+ Guia Completo', price:23000, label:'R$ 230', spiritual:true },
  { name:'Amarração Amorosa',    desc:'+ Guia Completo', price:24700, label:'R$ 247', spiritual:true },
];

function buildGrid(plans, id) {
  const el = document.getElementById(id);
  plans.forEach(p => {
    const d = document.createElement('div');
    d.className = 'plan' + (p.featured ? ' featured' : '') + (p.spiritual ? ' spiritual' : '');
    d.innerHTML =
      (p.featured ? '<span class="badge">Mais escolhida</span>' : '') +
      `<div class="plan-name">${p.name}</div>` +
      `<div class="plan-desc">${p.desc}</div>` +
      `<div class="plan-price">${p.label}</div>` +
      `<button class="plan-btn">Pagar com PIX</button>`;
    d.addEventListener('click', () => pay(p, d));
    el.appendChild(d);
  });
}
buildGrid(CONSULTAS,   'grid-c');
buildGrid(ESPIRITUAIS, 'grid-e');

let brCode = '';

async function pay(plan, card) {
  document.getElementById('pix-name').textContent  = plan.name;
  document.getElementById('pix-price').textContent = plan.label;
  document.getElementById('pix-code').textContent  = '';
  document.getElementById('err').style.display     = 'none';
  document.getElementById('qr-wrap').innerHTML     = '<div class="spinner"></div>';
  document.getElementById('btn-copy').textContent  = 'Copiar código PIX';
  document.getElementById('btn-copy').classList.remove('ok');
  brCode = '';

  document.getElementById('page-plans').classList.remove('active');
  document.getElementById('page-pix').classList.add('active');
  window.scrollTo(0, 0);
  card.classList.add('loading');

  try {
    const res = await fetch('/api/pix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: plan.price, name: plan.name }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.errors || json.error || 'Erro ' + res.status);

    brCode = json.data.br_code;
    document.getElementById('pix-code').textContent = brCode;
    document.getElementById('qr-wrap').innerHTML = '<div id="qr-r"></div>';
    new QRCode(document.getElementById('qr-r'), {
      text: brCode, width: 220, height: 220,
      colorDark: '#3b0764', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  } catch (e) {
    document.getElementById('qr-wrap').innerHTML = '';
    const el = document.getElementById('err');
    el.textContent = e.message || 'Erro ao gerar PIX. Tente novamente.';
    el.style.display = 'block';
  } finally {
    card.classList.remove('loading');
  }
}

document.getElementById('btn-copy').addEventListener('click', () => {
  if (!brCode) return;
  navigator.clipboard.writeText(brCode).then(() => {
    const b = document.getElementById('btn-copy');
    b.textContent = 'Copiado!';
    b.classList.add('ok');
    setTimeout(() => { b.textContent = 'Copiar código PIX'; b.classList.remove('ok'); }, 3000);
  });
});

document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('page-pix').classList.remove('active');
  document.getElementById('page-plans').classList.add('active');
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
